### WINDOWS AND WORKSPACES ###
########################<D-a>######

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

exec-once = waybar -s ~/.config/waybar/themes/ml4w/black/style.css -c ~/.config/waybar/themes/ml4w/config &
exec-once = sleep 2 && rog-control-center &

# exec-once = sleep 2 && discover-overlay &

# Adding this to remove restriction for gui apps
exec-once = sleep 2 && xhost +SI:localuser:root &

# Run polkit agent for password prompts in gui
exec-once = sleep 2 && /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &

# Enable tailscale in system tray
exec-once = sleep 2 && tailscale systray &

# Enable kdeconnect
exec-once = sleep 2 && kdeconnectd & kdeconnect-indicator &

# Run scripts in background
exec-once = sleep 2 && /home/adityaarch/.config/hypr/scripts/battery-notification.sh &

exec-once = mpvpaper -o "no-audio loop-file=inf panscan=1.0 hwdec=auto" '*' /home/adityaarch/Wallpapers/Videos/NFS-GTR.mp4
